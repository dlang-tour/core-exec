name: run-test-shell

on:
  workflow_dispatch:

  pull_request:

  push:
    branches:
      - master
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read
  packages: write
  # Buildx stores the layer cache through the Actions cache API.
  actions: write

jobs:
  main:
    name: Test image

    # Only run schedule for the main repository - not forks
    if: ${{ github.event_name != 'schedule' || github.repository == 'dlang-tour/core-exec' }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - { version: dmd-nightly, exec: dmd   }
          - { version: dmd-beta,    exec: dmd   }
          - { version: dmd,         exec: dmd   }
          - { version: ldc-beta,    exec: ldmd2 }
          - { version: ldc,         exec: ldmd2 }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # UTC date, shared by pull requests, pushes, and the daily
      # schedule. The next day changes the value, so the compiler
      # install and the dub prefetch run again. Apt stays cached.
      - name: Compiler cache epoch
        id: epoch
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          # Provenance emits a manifest list, which `docker load` rejects.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,scope=${{ matrix.version }},mode=max,ignore-error=true
          tags: ${{ steps.image.outputs.name }}:${{ matrix.version }}
          build-args: |
            DLANG_VERSION=${{ matrix.version }}
            DLANG_EXEC=${{ matrix.exec }}
            COMPILER_CACHE_EPOCH=${{ steps.epoch.outputs.value }}

      - name: Test image
        run: ./test.sh "${{ steps.image.outputs.name }}:${{ matrix.version }}"

      - name: Push image
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        run: docker push "${{ steps.image.outputs.name }}:${{ matrix.version }}"
